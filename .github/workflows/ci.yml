name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coding tests need the macOS sandbox-exec profile. A Linux run would skip
  # those tests and must not stand in for this complete offline contract job.
  offline-contracts-macos:
    name: offline-contracts-macos
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked adapter dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Acquire pinned public DSH APIs (registry access required)
        run: |
          npm install --prefix "$RUNNER_TEMP/rdsh-public-dsh" \
            --ignore-scripts --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.0-rc.2 \
            @deepseek-ai/cordis@4.0.4 \
            @deepseek-ai/dsh-system-prompt@0.2.0-rc.2 \
            @deepseek-ai/dsh-tools@0.2.0-rc.2
          echo "RDSH_PUBLIC_DSH_MODULES=$RUNNER_TEMP/rdsh-public-dsh/node_modules" >> "$GITHUB_ENV"
      - name: Verify native API prerequisites
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import assert from 'node:assert/strict';
          import { supportedSandbox } from './coding-tools.mjs';
          assert.equal(supportedSandbox().supported, true, 'macOS coding sandbox is required');
          const expected = { dsh: '0.2.0-rc.2', cordis: '4.0.4', 'dsh-system-prompt': '0.2.0-rc.2', 'dsh-tools': '0.2.0-rc.2' };
          for (const [name, version] of Object.entries(expected)) {
            const root = join(process.env.RDSH_PUBLIC_DSH_MODULES, '@deepseek-ai', name);
            assert.equal(JSON.parse(readFileSync(join(root, 'package.json'), 'utf8')).version, version);
            if (name !== 'dsh') assert.ok(existsSync(join(root, 'lib/index.js')), `missing ${name} native API`);
          }
          JS
      - name: Run native contracts including real Cordis (no model calls)
        run: |
          NODE_OPTIONS=--test-reporter=tap npm test | tee "$RUNNER_TEMP/rdsh-node-tests.tap"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const tap = readFileSync(`${process.env.RUNNER_TEMP}/rdsh-node-tests.tap`, 'utf8');
          assert.match(tap, /^# tests [1-9]\d*$/m, 'no Node tests ran');
          for (const field of ['fail', 'cancelled', 'skipped', 'todo']) {
            assert.match(tap, new RegExp(`^# ${field} 0$`, 'm'), `Node ${field} must be zero`);
          }
          JS
      - name: Check out the pinned Harness² core
        uses: actions/checkout@v7
        with:
          repository: google-research/harness2
          ref: 1cfe254e8d25b15f37048c3730134686abe60335
          path: .local/harness2-ci
          persist-credentials: false
      - name: Install the actual pinned Harness² core
        run: python -m pip install --no-deps -e .local/harness2-ci
      - name: Run Python adapter contracts (no model calls)
        run: python -m unittest discover -s python/tests -v
      - name: Verify published evaluation aggregates (no model calls)
        run: python analysis/reaggregate.py --verify
      - name: Run evaluation analysis contracts (no model calls)
        run: python -m unittest discover -s analysis/tests -v
      - name: Replay all cursor boundary cases in the macOS sandbox
        run: node analysis/replay-cursor.mjs
